<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS Tools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2313294b%27/%3E%3Crect x=%277%27 y=%277%27 width=%278%27 height=%278%27 rx=%272%27 fill=%27%23f3f6fb%27/%3E%3Crect x=%2717%27 y=%277%27 width=%278%27 height=%278%27 rx=%272%27 fill=%27%23c99a3b%27/%3E%3Crect x=%277%27 y=%2717%27 width=%278%27 height=%278%27 rx=%272%27 fill=%27%23c99a3b%27/%3E%3Crect x=%2717%27 y=%2717%27 width=%278%27 height=%278%27 rx=%272%27 fill=%27%23f3f6fb%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy masthead, then one card per tool. Same palette as Education by Geography. */
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#14223b; --muted:#5a6579; --line:#dbe1ea;
  --navy:#13294b; --navy-2:#1e3d6b; --on-navy:#f3f6fb; --on-navy-muted:#b6c4da; --gold:#c99a3b;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1320; --panel:#141e2f; --ink:#e7ecf4; --muted:#9aa7bb; --line:#26334a;
  --navy:#0f2140; --navy-2:#173159; --on-navy:#eef3fa; --on-navy-muted:#a7b6cd; --gold:#ddb35e; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:980px;margin:0 auto}
.mast{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:var(--on-navy);padding-block:40px 84px;position:relative;overflow:hidden}
.mast::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:28px 28px;mask-image:linear-gradient(90deg,transparent,#000 70%)}
.mast .inner{position:relative;z-index:1}
h1{font-size:30px;margin:0;letter-spacing:-.015em}
.mast p{margin:6px 0 0;color:var(--on-navy-muted);max-width:60ch}
.tools{margin-top:-56px;position:relative;z-index:2;padding-bottom:56px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
a.tool{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:24px;text-decoration:none;color:inherit;box-shadow:0 12px 32px -20px rgba(10,25,50,.5);
  border-top:4px solid var(--gold);transition:transform .15s ease,box-shadow .15s ease}
a.tool:hover{transform:translateY(-2px);box-shadow:0 18px 40px -20px rgba(10,25,50,.6)}
a.tool:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ic{width:52px;height:52px;border-radius:12px;background:var(--navy);display:grid;place-items:center}
.ic svg{width:34px;height:34px}
h2{font-size:20px;margin:0}
.tool p{margin:0;color:var(--muted)}
.go{margin-top:auto;font-weight:600;color:var(--navy-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .go{color:var(--gold)}}
@media (prefers-reduced-motion:reduce){a.tool{transition:none}a.tool:hover{transform:none}}
</style>
</head>
<body>
<div class="mast pad"><div class="inner">
  <h1>GPS Tools</h1>
  <p>Pick a tool.</p>
</div></div>
<div class="tools pad"><div class="inner grid">
  <a class="tool" href="weighting/">
    <span class="ic"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="17" width="4.5" height="9" rx="1" fill="#fff"/><rect x="13.75" y="10" width="4.5" height="16" rx="1" fill="#fff"/><rect x="20.5" y="13.5" width="4.5" height="12.5" rx="1" fill="#8FB8DC"/></svg></span>
    <h2>Rim Weighting</h2>
    <p>Reads an SPSS .sav file in the browser, builds rake schemes, and writes SPSSINC RAKE syntax.</p>
    <span class="go">Open →</span>
  </a>
  <a class="tool" href="education/">
    <span class="ic"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 10 2 24l30 14 30-14z" fill="#f3f6fb"/><path d="M14 31v13c0 5 8 9 18 9s18-4 18-9V31L32 39z" fill="#f3f6fb" opacity=".85"/><path d="M56 27v16" stroke="#c99a3b" stroke-width="3"/><circle cx="56" cy="46" r="4" fill="#c99a3b"/></svg></span>
    <h2>Education by Geography</h2>
    <p>Voter, eligible-voter and adult education mix by district, county or city, from Census data.</p>
    <span class="go">Open →</span>
  </a>
</div></div>
</body>
</html>
