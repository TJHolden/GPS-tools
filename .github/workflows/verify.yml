name: Verify education math
on:
  push:
    branches: [verify]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node verify/check18.mjs
      - if: always()
        run: |
          git config user.name "verify-bot"; git config user.email "verify-bot@users.noreply.github.com"
          git add verify/results18.txt && git commit -m "Verification results" && git push origin HEAD:verify
