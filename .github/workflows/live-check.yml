name: Live check
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1"   # Mondays, catches Census API changes
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/live-check.mjs
